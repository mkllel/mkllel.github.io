<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MinKyu Lee</title>
    <script>
      (function(location) {
        var pathSegmentsToKeep = 0;

        location.replace(
          location.protocol +
            '//' +
            location.hostname +
            (location.port ? ':' + location.port : '') +
            location.pathname
              .split('/')
              .slice(0, 1 + pathSegmentsToKeep)
              .join('/') +
            '/?/' +
            location.pathname
              .slice(1)
              .split('/')
              .slice(pathSegmentsToKeep)
              .join('/')
              .replace(/&/g, '~and~') +
            (location.search
              ? '&' + location.search.slice(1).replace(/&/g, '~and~')
              : '') +
            location.hash
        );
      })(window.location);
    </script>
  </head>
  <body></body>
</html>
