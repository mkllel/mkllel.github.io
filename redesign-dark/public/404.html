<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>MinKyu Lee</title>
    <script>
      (function(location) {
        var pathSegmentsToKeep = 0;

        location.replace(
          location.protocol +
            '//' +
            location.hostname +
            (location.port ? ':' + location.port : '') +
            location.pathname
              .split('/')
              .slice(0, 1 + pathSegmentsToKeep)
              .join('/') +
            '/?/' +
            location.pathname
              .slice(1)
              .split('/')
              .slice(pathSegmentsToKeep)
              .join('/')
              .replace(/&/g, '~and~') +
            (location.search
              ? '&' + location.search.slice(1).replace(/&/g, '~and~')
              : '') +
            location.hash
        );
      })(window.location);
    </script>
  </head>
  <body>
    <noscript>
      요청한 페이지를 열려면 JavaScript가 필요합니다.
      <a href="/">포트폴리오 홈으로 이동</a>
    </noscript>
  </body>
</html>
